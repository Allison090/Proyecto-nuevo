<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="600" height="380" fill="#0b1329" rx="12" />

  <!-- Browser top bar -->
  <rect width="600" height="42" fill="#1e293b" rx="12" />
  <circle cx="28" cy="21" r="6" fill="#ef4444" />
  <circle cx="48" cy="21" r="6" fill="#f59e0b" />
  <circle cx="68" cy="21" r="6" fill="#10b981" />
  <rect x="110" y="10" width="380" height="22" rx="6" fill="#334155" />
  <text x="300" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">https://weather-hub.demo</text>

  <!-- Weather App Card -->
  <rect x="50" y="65" width="500" height="280" rx="12" fill="url(#p3Grad)" />
  
  <!-- Sun and Cloud Graphic -->
  <circle cx="160" cy="160" r="50" fill="#facc15" />
  <path d="M140 200 A 30 30 0 0 1 190 180 A 40 40 0 0 1 250 200 A 30 30 0 0 1 230 230 L 140 230 A 20 20 0 0 1 140 200 Z" fill="#ffffff" opacity="0.9" />

  <!-- Weather Info -->
  <text x="310" y="140" fill="#ffffff" font-family="sans-serif" font-size="48" font-weight="bold">24°C</text>
  <text x="315" y="175" fill="#e0f2fe" font-family="sans-serif" font-size="20">Parcialmente Nublado</text>
  <text x="315" y="205" fill="#bae6fd" font-family="sans-serif" font-size="14">Humedad: 65% • Viento: 14 km/h</text>

  <!-- Weekly forecast row -->
  <rect x="75" y="255" width="85" height="65" rx="6" fill="#ffffff" opacity="0.15" />
  <text x="117" y="280" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Lun</text>
  <text x="117" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">23°</text>

  <rect x="170" y="255" width="85" height="65" rx="6" fill="#ffffff" opacity="0.15" />
  <text x="212" y="280" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Mar</text>
  <text x="212" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">25°</text>

  <rect x="265" y="255" width="85" height="65" rx="6" fill="#ffffff" opacity="0.15" />
  <text x="307" y="280" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Mié</text>
  <text x="307" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">22°</text>

  <rect x="360" y="255" width="85" height="65" rx="6" fill="#ffffff" opacity="0.15" />
  <text x="402" y="280" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Jue</text>
  <text x="402" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">26°</text>

  <rect x="455" y="255" width="85" height="65" rx="6" fill="#ffffff" opacity="0.15" />
  <text x="497" y="280" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Vie</text>
  <text x="497" y="305" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">27°</text>
</svg>
